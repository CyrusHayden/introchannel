name: Seeding

on:
  schedule:
    - cron: "37 14 * * *"   # ~21:30 gio VN (phien My)
    - cron: "37 1 * * *"    # ~08:30 gio VN (phien A)
    - cron: "7 8 * * *"     # ~15:00 gio VN (phien London)
  workflow_dispatch:
    inputs:
      slot:
        description: "Khung: 0=21:30, 1=08:30, 2=15:00 (de trong = tu nhan theo gio)"
        required: false
        default: ""
      dry_run:
        description: "true = chi in ra, khong gui that"
        required: false
        default: "true"

permissions:
  contents: write

concurrency:
  group: seeding
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run seeding
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          MAIN_ACCOUNT: ${{ secrets.MAIN_ACCOUNT }}
          SLOT: ${{ github.event.inputs.slot }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python seeding.py
      - name: Save state
        if: always()
        run: |
          git config user.name "seeding-bot"
          git config user.email "seeding-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state [skip ci]" && git push)
